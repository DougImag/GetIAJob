# Surcharge de production (VPS) : image construite par GitHub Actions et publiée sur GHCR,
# ports internes fermés au public : Streamlit n'écoute que sur 127.0.0.1, derrière un proxy HTTPS.
#
# Sur le serveur, le fichier .env contient :
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# pour que toutes les commandes `docker compose` (déploiement, scripts cron) utilisent cette surcharge.
# Proxy HTTPS : Apache déjà installé sur le serveur (deploy/apache-getiajob.conf), ou Caddy fourni
# (service « proxy ») en ajoutant COMPOSE_PROFILES=prod.
# Nécessite Docker Compose ≥ 2.24 (balises !reset / !override).

x-image: &image
  image: ${GETIAJOB_IMAGE:-ghcr.io/dougimag/getiajob}:${GETIAJOB_TAG:-latest}
  build: !reset null

services:
  db:
    ports: !reset []

  web:
    <<: *image
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8501}:8501"

  app:
    <<: *image

  # Ollama en conteneur (profil « ollama ») : jamais publié sur Internet (Docker contourne ufw).
  # L'application le joint par le réseau Docker : OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    ports: !reset []
