# Apache en reverse proxy HTTPS devant Streamlit (conteneur « web » publié sur 127.0.0.1:8501).
#
# Installation (Debian/Ubuntu, Apache ≥ 2.4.47 pour « upgrade=websocket ») :
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo cp deploy/apache-getiajob.conf /etc/apache2/sites-available/getiajob.conf
#   sudo sed -i 's/getiajob.mondomaine.fr/<ton-sous-domaine>/g' /etc/apache2/sites-available/getiajob.conf
#   sudo a2ensite getiajob && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d <ton-sous-domaine>      # certificat Let's Encrypt + bloc *:443
#
# Certbot crée le VirtualHost *:443 (getiajob-le-ssl.conf) en recopiant ce bloc ; les directives de
# proxy ci-dessous y sont donc reprises. Le bloc *:80 ne fait plus ensuite que rediriger vers HTTPS.

<VirtualHost *:80>
        ServerName getiajob.jorkers.com

        DocumentRoot /opt/getiajob

        <Directory /opt/getiajob>
                AllowOverride All
                Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/getiajob_error.log
        CustomLog ${APACHE_LOG_DIR}/getiajob_access.log combined

        RewriteEngine On
        RewriteCond %{HTTPS} !=on
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

	php_value error_log ${APACHE_LOG_DIR}/getiajob_php_errors.log

</VirtualHost>

<VirtualHost *:443>
        ServerName getiajob.jorkers.com

        DocumentRoot /opt/getiajob

        <Directory /opt/getiajob>
                AllowOverride All
                Require all granted
        </Directory>

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/jorkers.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/jorkers.com/privkey.pem

        ErrorLog ${APACHE_LOG_DIR}/getiajob_ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/getiajob_ssl_access.log combined

	php_value error_log ${APACHE_LOG_DIR}/getiajob_php_errors.log
 
</VirtualHost>