# Intégration et déploiement continus :
#   - à chaque push / pull request : lint (ruff) + tests (pytest)
#   - sur la branche main : image Docker publiée sur GHCR, puis déploiement sur le VPS par SSH
#
# Secrets à créer (Settings › Secrets and variables › Actions, ou dans l'environnement « production ») :
#   VPS_HOST          adresse IP ou nom du VPS
#   VPS_USER          utilisateur de déploiement (ex. deploy), membre du groupe docker
#   VPS_SSH_KEY       clé privée SSH dédiée au déploiement (sa clé publique est dans authorized_keys)
#   VPS_KNOWN_HOSTS   sortie de `ssh-keyscan -H <VPS_HOST>` (empreinte du serveur)
# Variables facultatives : VPS_PORT (défaut 22), VPS_PATH (défaut /opt/getiajob).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/getiajob' }}
    steps:
      - name: Clé SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Déploiement
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le jeton GHCR (valable le temps du job) est transmis sur l'entrée standard, jamais en argument.
          echo "$GHCR_TOKEN" | $SSH "
            set -e
            cd '$VPS_PATH'
            git fetch --quiet origin main
            git reset --hard '${{ github.sha }}'
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            status=0
            GETIAJOB_IMAGE='$IMAGE' sh deploy/deploy.sh '${{ github.sha }}' || status=\$?
            docker logout ghcr.io >/dev/null || true
            exit \$status
          "
