[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getiajob"
version = "0.12.0"
description = "Pipeline multi-agents (LangGraph + LLM open source) pour trouver rapidement les offres LinkedIn qui collent à un CV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tenacity>=8.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.50",
    "bcrypt>=4.2",
    "Authlib>=1.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
getiajob = "getiajob.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/getiajob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
